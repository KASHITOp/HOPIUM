name: heartbeat
# Self-healing hourly scheduler (GitHub's own `schedule` fired 3 times in 20 h on 2026-11-04/05, always late).
# Each run sleeps until the next HH:02 UTC, dispatches hourly.yml, and ALWAYS dispatches the next heartbeat, even if
# an earlier step failed or the run was cancelled. The concurrency group keeps at most one running + one pending
# heartbeat, so extra dispatches (from hourly.yml, the cron watchdog below, or a manual kick) collapse instead of
# multiplying. The DB rejects duplicate and late inserts, so overlap is harmless; missed hours stay missed.
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"   # watchdog: re-arms the chain if GitHub ever fires it
  push:
    branches: [main]
    paths: [ml/ops/heartbeat-start]
permissions: { actions: write, contents: read }
concurrency: { group: heartbeat, cancel-in-progress: false }
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Sleep until the next HH:02 UTC
        run: |
          now=$(date -u +%s); this=$(( now / 3600 * 3600 + 120 ))
          if [ "$now" -lt "$this" ]; then next=$this; else next=$(( this + 3600 )); fi
          echo "sleeping $(( next - now ))s until $(date -u -d @$next +%T)"
          sleep $(( next - now ))
      - name: Dispatch hourly
        run: |
          for i in 1 2 3 4 5; do gh workflow run hourly.yml -R "$REPO" --ref main && echo "hourly dispatched $(date -u +%T)" && exit 0; sleep $((i*10)); done
          exit 1
      - name: Always queue the next heartbeat
        if: always()
        run: |
          for i in 1 2 3 4 5; do gh workflow run heartbeat.yml -R "$REPO" --ref main && echo "next heartbeat queued" && exit 0; sleep $((i*10)); done
          exit 1
