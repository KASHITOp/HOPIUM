name: probe-data-sources
# Which data sources answer from a GitHub-hosted (US) runner? Run manually; results go in ml/DATA.md.
on:
  workflow_dispatch:
  push:
    branches: [claude/hopium-engine-v3]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() { code=$(curl -s -o /tmp/b -w "%{http_code}" -m 20 "$2"); echo "$1 -> HTTP $code $(head -c 120 /tmp/b | tr -d '\n')"; }
          check binance-vision-spot "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1"
          check binance-spot        "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1"
          check binance-futures     "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=1"
          check bybit               "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          check deribit-funding     "https://www.deribit.com/api/v2/public/get_funding_rate_value?instrument_name=BTC-PERPETUAL&start_timestamp=$(( ($(date +%s)-7200)*1000 ))&end_timestamp=$(( $(date +%s)*1000 ))"
          check kraken-futures      "https://futures.kraken.com/derivatives/api/v3/tickers"
          check coinbase            "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600"
          check fear-greed          "https://api.alternative.me/fng/?limit=1"
