name: hourly
# Fetch -> predict -> grade. Safe to re-run: the DB rejects duplicate (coin, horizon, candle_close_time)
# rows and late inserts; predict.py skips (and logs "missed") if it starts > 20 min after the candle close.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
concurrency: { group: hourly, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ml } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_LINK }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_ROLE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Predict (skips and logs if late)
        run: python -m hopium.predict
      - name: Grade matured predictions
        if: always()
        run: python -m hopium.grade
      - name: Refresh candles cache (90 days)
        if: always()
        run: python -m hopium.cache_candles
