name: hourly-predict-and-grade
on:
  schedule:
    - cron: "3 * * * *"   # a few minutes after each candle closes
  workflow_dispatch:
concurrency: { group: hourly, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: ml } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Grade matured predictions
        run: python grade.py
      - name: Make new predictions
        run: python predict.py
