name: retrain
on:
  schedule:
    - cron: "17 2 * * 0"   # Sundays 02:17 UTC
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: retrain, cancel-in-progress: false }
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: ml } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_LINK }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_ROLE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - name: Lookahead tests
        run: python -m pytest -q
      - name: Fetch history
        run: python -m hopium.fetch
      - name: Walk-forward train + quality gate (fails the job if OOS accuracy > 65%)
        run: python -m hopium.train --publish
      - name: Commit model artifacts
        working-directory: .
        run: |
          git config user.name "hopium-bot"
          git config user.email "hopium-bot@users.noreply.github.com"
          git add ml/models/model_*.pkl ml/models/metrics.json
          git diff --cached --quiet || git commit -m "Weekly retrain $(date -u +%F)"
          git push
