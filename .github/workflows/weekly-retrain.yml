name: weekly-retrain
on:
  schedule:
    - cron: "17 2 * * 0"  # Sundays 02:17 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r ml/requirements.txt
      - name: Fetch, train (walk-forward + quality gate), export site data
        working-directory: ml
        run: |
          python fetch.py
          python train.py
          python export_site_data.py
      - name: Commit new model
        run: |
          git config user.name "hopium-bot"
          git config user.email "hopium-bot@users.noreply.github.com"
          git add ml/models/*.pkl ml/models/metrics.json web/public/data
          git diff --cached --quiet || git commit -m "Weekly retrain $(date -u +%F)"
          git push
